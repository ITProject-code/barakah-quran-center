<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#0F766E"/>
  
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#C9A227" stroke-width="2"/>
  
  <!-- Quran Book Icon -->
  <g transform="translate(50, 50)">
    <!-- Book cover -->
    <rect x="-18" y="-22" width="36" height="44" rx="2" fill="none" stroke="#C9A227" stroke-width="2"/>
    
    <!-- Pages -->
    <line x1="-12" y1="-14" x2="12" y2="-14" stroke="#C9A227" stroke-width="1.5"/>
    <line x1="-12" y1="-6" x2="12" y2="-6" stroke="#C9A227" stroke-width="1.5"/>
    <line x1="-12" y1="2" x2="12" y2="2" stroke="#C9A227" stroke-width="1.5"/>
    <line x1="-12" y1="10" x2="6" y2="10" stroke="#C9A227" stroke-width="1.5"/>
    
    <!-- Book spine -->
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#C9A227" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Islamic star/ornament -->
    <polygon points="0,-28 3,-18 14,-18 5,-11 9,0 0,-6 -9,0 -5,-11 -14,-18 -3,-18" fill="#C9A227" opacity="0.4"/>
  </g>
  
  <!-- Small decorative dots -->
  <circle cx="30" cy="30" r="2" fill="#C9A227" opacity="0.4"/>
  <circle cx="70" cy="30" r="2" fill="#C9A227" opacity="0.4"/>
  <circle cx="30" cy="70" r="2" fill="#C9A227" opacity="0.4"/>
  <circle cx="70" cy="70" r="2" fill="#C9A227" opacity="0.4"/>
</svg>